<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Filmora Kinolar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #0b0d12; --card: #151923; --accent: #e50914; --gold: #f59e0b; --text: #f3f4f6; --muted: #9ca3af; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px 14px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); }
    .search-box { position: relative; margin-bottom: 12px; }
    .search-box input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 12px 38px; color: var(--text); font-size: 14px; outline: none; }
    .search-box input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .poster { position: relative; width: 100%; aspect-ratio: 2 / 3; background: #1c2230; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.78); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .prem-badge { position: absolute; top: 8px; right: 8px; background: var(--gold); color: #000; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
    .info { padding: 10px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; gap: 8px; }
    .title { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .meta { font-size: 11px; color: var(--muted); }
    .watch-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 9px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .watch-btn.prem { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 10px; }
  </style>
</head>
<body>
  <header><div class="brand">🎬 FILMORA <span>KINOLAR</span></div></header>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Kino nomi yoki kodi bo‘yicha qidirish..." oninput="renderCatalog()" />
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">Barchasi</button>
    <button class="tab" onclick="setFilter('free', this)">Bepul kinolar</button>
    <button class="tab" onclick="setFilter('premium', this)">💎 Premium</button>
  </div>
  <div class="grid" id="catalogGrid"><div class="empty">⏳ Katalog yuklanmoqda...</div></div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    const SERVER_URL = "https://filmora-server.onrender.com";
    let CATALOG = [];
    let currentFilter = "all";

    async function loadCatalog() {
      try {
        const res = await fetch(`${SERVER_URL}/api/catalog`);
        const data = await res.json();
        CATALOG = data.items || [];
      } catch (e) { CATALOG = []; }
      renderCatalog();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      renderCatalog();
    }

    function renderCatalog() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const grid = document.getElementById("catalogGrid");
      const filtered = CATALOG.filter(item => {
        const matchType = currentFilter === "all" || (currentFilter === "premium" && item.premium) || (currentFilter === "free" && !item.premium);
        const matchQuery = !q || item.title.toLowerCase().includes(q) || String(item.code).includes(q);
        return matchType && matchQuery;
      });
      if (!filtered.length) { grid.innerHTML = `<div class="empty">Kinolar topilmadi 😕</div>`; return; }
      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="poster">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <div class="badge">Kod: ${item.code}</div>
            ${item.premium ? `<div class="prem-badge">💎 PREMIUM</div>` : ``}
          </div>
          <div class="info">
            <div><div class="title">${item.title}</div><div class="meta">${item.year}</div></div>
            <button class="watch-btn ${item.premium ? 'prem' : ''}" onclick="requestMovie('${item.code}', this)">
              ${item.premium ? '💎 Ko‘rish' : '▶ Ko‘rish'}
            </button>
          </div>
        </div>
      `).join("");
    }

    async function requestMovie(code, btn) {
      const userId = tg.initDataUnsafe?.user?.id;
      if (!userId) { tg.showAlert("Iltimos, katalogni @Filmorabot_bot ichidan oching!"); return; }
      const oldText = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = "⏳ Yuborilmoqda...";
      try {
        const res = await fetch(`${SERVER_URL}/api/watch`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, code: String(code) })
        });
        const data = await res.json();
        if (data.ok) tg.close();
        else if (data.error === "not_subscribed") { tg.showAlert("Avval kanallarga obuna bo‘ling!"); tg.close(); }
        else if (data.error === "premium_required") { tg.showAlert("Bu Premium kino! Botdagi 💎 Premium bo‘limidan obuna oling."); tg.close(); }
        else tg.showAlert("Kino topilmadi.");
      } catch (err) {
        tg.showAlert("Server uyg‘onmoqda (15-20 soniya). Yana bir marta bosing!");
      } finally { btn.disabled = false; btn.innerHTML = oldText; }
    }
    loadCatalog();
  </script>
</body>
</html>
